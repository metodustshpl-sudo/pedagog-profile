// ============= УТИЛІТИ =============
async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        return await fetch(url, { signal: controller.signal });
    } finally {
        clearTimeout(timeoutId);
    }
}

async function fetchTextWithRetry(url, options = {}) {
    const { timeoutMs = 5000, attempts = 3, retryDelayMs = 600 } = options;
    let lastError = null;

    for (let attempt = 1; attempt <= attempts; attempt++) {
        try {
            const response = await fetchWithTimeout(url, timeoutMs);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.text();
        } catch (e) {
            lastError = e;
            if (attempt < attempts) {
                await new Promise(resolve => setTimeout(resolve, retryDelayMs));
            }
        }
    }

    throw lastError || new Error('Помилка мережі');
}

function isLikelyCorsError(err) {
    const msg = String(err?.message || err || '');
    return msg.includes('Failed to fetch') || msg.includes('CORS') || msg.includes('Access-Control-Allow-Origin');
}

async function loadGvizPayloadViaScript(url, timeoutMs = 7000) {
    // Працює навіть з file:// (origin null), бо <script> не підпадає під fetch/CORS так само.
    return await new Promise((resolve, reject) => {
        const prevGoogle = window.google;
        const prevSetResponse = prevGoogle?.visualization?.Query?.setResponse;

        let done = false;
        const cleanup = () => {
            try { script.remove(); } catch {}
            if (prevGoogle) {
                // відновлюємо попередній google (якщо був)
                window.google = prevGoogle;
                if (prevSetResponse) {
                    window.google.visualization = window.google.visualization || {};
                    window.google.visualization.Query = window.google.visualization.Query || {};
                    window.google.visualization.Query.setResponse = prevSetResponse;
                }
            } else {
                // прибираємо тимчасовий об'єкт
                try { delete window.google; } catch { window.google = undefined; }
            }
        };

        const timer = setTimeout(() => {
            if (done) return;
            done = true;
            cleanup();
            reject(new Error('GViz script timeout'));
        }, timeoutMs);

        // Ставимо тимчасовий хук, який перехопить setResponse(...)
        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = window.google.visualization.Query || {};
        window.google.visualization.Query.setResponse = (payload) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            cleanup();
            resolve(payload);
        };

        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onerror = () => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            cleanup();
            reject(new Error('GViz script load error'));
        };
        document.head.appendChild(script);
    });
}

async function fetchTextOrGvizScript(url, options = {}) {
    try {
        return await fetchTextWithRetry(url, options);
    } catch (e) {
        // Якщо це GViz JSON і ми в file:// або схоже на CORS — пробуємо через <script>
        const isGvizJson = String(url).includes('/gviz/') && String(url).includes('tqx=out:json');
        const isFile = window.location.protocol === 'file:';
        if (isGvizJson && (isFile || isLikelyCorsError(e))) {
            return await loadGvizPayloadViaScript(url, options.timeoutMs || 7000);
        }
        throw e;
    }
}

async function loadTeachersFromGoogle() {
    let lastError = null;

    for (const url of TEACHERS_SHEET_URLS) {
        try {
            const text = await fetchTextOrGvizScript(url, {
                timeoutMs: 7000,
                attempts: 2,
                retryDelayMs: 700
            });
            if (!text) continue;

            if (url.includes('tqx=out:csv')) {
                const teachers = parseSimpleCSV(text, {
                    idField: 'ID',
                    nameField: 'П.І.П',
                    positionField: 'Посада',
                    birthField: 'Рік народження'
                });
                if (teachers.length > 0) return teachers;
            } else if (url.includes('/gviz/')) {
                const teachers = parseGvizTeachers(text);
                if (teachers.length > 0) return teachers;
            } else {
                const teachers = parseSimpleCSV(text, {
                    idField: 'ID',
                    nameField: 'П.І.П',
                    positionField: 'Посада',
                    birthField: 'Рік народження'
                });
                if (teachers.length > 0) return teachers;
            }
        } catch (e) {
            lastError = new Error(`${e.message} (${url})`);
        }
    }

    throw lastError || new Error('Google Sheets не повернула дані');
}

}

function parseGvizTeachers(textOrPayload) {
    const payload = typeof textOrPayload === 'string'
        ? (() => {
            const match = textOrPayload.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?/);
            if (!match || !match[1]) return null;
            return JSON.parse(match[1]);
        })()
        : textOrPayload;
    if (!payload) return [];
    const table = payload?.table;
    const cols = table?.cols || [];
    const rows = table?.rows || [];

    const colLabels = cols.map(c => (c?.label || '').trim());
    const idIdx = colLabels.indexOf('ID');
    const nameIdx = colLabels.indexOf('П.І.П');
    const posIdx = colLabels.indexOf('Посада');
    const birthIdx = colLabels.indexOf('Рік народження');
    const combinedPosIdx = colLabels.indexOf('Суміщена посада');
    const eduIdx = colLabels.indexOf('Навчальний заклад, рік закінчення');
    const eduLevelIdx = colLabels.indexOf('Освітньо-кваліфікаційний рівень');
    const specialtyIdx = colLabels.indexOf('Спеціальність за дипломом');
    const qualificationIdx = colLabels.indexOf('Кваліфікація за дипломом');
    const workerRankIdx = colLabels.indexOf('Робітничий розряд за професією/професіям');
    const totalExpIdx = colLabels.indexOf('Стаж заг');
    const pedExpIdx = colLabels.indexOf('Стаж пед');
    const roleExpIdx = colLabels.indexOf('Стаж на посаді');
    const mainCatIdx = colLabels.indexOf('Квал. категорія; Тар. розряд за основною посадою');
    const combinedCatIdx = colLabels.indexOf('Квал. категорія; Тар. розряд за суміщеною посадою');
    const titleIdx = colLabels.indexOf('Пед. звання');
    if (idIdx < 0 || nameIdx < 0 || posIdx < 0) return [];

    const teachers = [];
    for (const row of rows) {
        const cells = row?.c || [];
        const id = parseInt(String(cells[idIdx]?.v ?? '').trim(), 10) || 0;
        if (id <= 0) continue;

        teachers.push({
            id,
            name: String(cells[nameIdx]?.v ?? '').trim(),
            position: String(cells[posIdx]?.v ?? '').trim(),
            birthDate: String(cells[birthIdx]?.f ?? cells[birthIdx]?.v ?? '').trim(),
            combinedPosition: String(cells[combinedPosIdx]?.v ?? '').trim(),
            education: String(cells[eduIdx]?.v ?? '').trim(),
            educationLevel: String(cells[eduLevelIdx]?.v ?? '').trim(),
            specialty: String(cells[specialtyIdx]?.v ?? '').trim(),
            qualification: String(cells[qualificationIdx]?.v ?? '').trim(),
            workerRank: String(cells[workerRankIdx]?.v ?? '').trim(),
            totalExperience: String(cells[totalExpIdx]?.v ?? '').trim(),
            pedagogicalExperience: String(cells[pedExpIdx]?.v ?? '').trim(),
            positionExperience: String(cells[roleExpIdx]?.v ?? '').trim(),
            mainCategory: String(cells[mainCatIdx]?.v ?? '').trim(),
            combinedCategory: String(cells[combinedCatIdx]?.v ?? '').trim(),
            pedagogicalTitle: String(cells[titleIdx]?.v ?? '').trim()
        });
    }

    return teachers.sort((a, b) => a.id - b.id);
}

function parseSimpleCSV(text, options = {}) {
    const { idField = 'ID', nameField = 'П.І.П', positionField = 'Посада', birthField = 'Рік народження' } = options;
    const rows = parseCSVData(text);
    
    if (rows.length < 2) return [];
    
    const headers = rows[0];
    const idIdx = headers.indexOf(idField);
    const nameIdx = headers.indexOf(nameField);
    const posIdx = headers.indexOf(positionField);
    const birthIdx = headers.indexOf(birthField);
    const combinedPosIdx = headers.indexOf('Суміщена посада');
    const eduIdx = headers.indexOf('Навчальний заклад, рік закінчення');
    const eduLevelIdx = headers.indexOf('Освітньо-кваліфікаційний рівень');
    const specialtyIdx = headers.indexOf('Спеціальність за дипломом');
    const qualificationIdx = headers.indexOf('Кваліфікація за дипломом');
    const workerRankIdx = headers.indexOf('Робітничий розряд за професією/професіям');
    const totalExpIdx = headers.indexOf('Стаж заг');
    const pedExpIdx = headers.indexOf('Стаж пед');
    const roleExpIdx = headers.indexOf('Стаж на посаді');
    const mainCatIdx = headers.indexOf('Квал. категорія; Тар. розряд за основною посадою');
    const combinedCatIdx = headers.indexOf('Квал. категорія; Тар. розряд за суміщеною посадою');
    const titleIdx = headers.indexOf('Пед. звання');
    
    const teachers = [];
    for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        const id = parseInt(values[idIdx]) || 0;
        
        if (id <= 0) continue;
        
        teachers.push({
            id: id,
            name: (values[nameIdx] || '').trim(),
            position: (values[posIdx] || '').trim(),
            birthDate: (values[birthIdx] || '').trim(),
            combinedPosition: (values[combinedPosIdx] || '').trim(),
            education: (values[eduIdx] || '').trim(),
            educationLevel: (values[eduLevelIdx] || '').trim(),
            specialty: (values[specialtyIdx] || '').trim(),
            qualification: (values[qualificationIdx] || '').trim(),
            workerRank: (values[workerRankIdx] || '').trim(),
            totalExperience: (values[totalExpIdx] || '').trim(),
            pedagogicalExperience: (values[pedExpIdx] || '').trim(),
            positionExperience: (values[roleExpIdx] || '').trim(),
            mainCategory: (values[mainCatIdx] || '').trim(),
            combinedCategory: (values[combinedCatIdx] || '').trim(),
            pedagogicalTitle: (values[titleIdx] || '').trim()
        });
    }
    
    return teachers.sort((a, b) => a.id - b.id);
}

function parseCertificationsCSV(text) {
    const rows = parseCSVData(text);
    if (rows.length < 2) return [];
    
    const headers = rows[0];
    const certs = [];
    
    for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        const id = parseInt(values[0]) || 0;
        
        if (id <= 0) continue;
        
        const cert = {
            id: id,
            name: (values[1] || '').trim(),
            form: (values[2] || '').trim(),
            program: (values[3] || '').trim(),
            location: (values[4] || '').trim(),
            status: (values[5] || '').trim(),
            date: (values[6] || '').trim(),
            hours: (values[7] || '').trim(),
            document: (values[8] || '').trim(),
            ects: (values[9] || '').trim(),
            year: (values[10] || '').trim()
        };
        
        certs.push(cert);
    }
    
    return certs;
}

function normalizeHeader(text) {
    return String(text || '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
}

function findHeaderIndex(headers, candidates) {
    const normalized = headers.map(normalizeHeader);
    for (const candidate of candidates) {
        const idx = normalized.indexOf(normalizeHeader(candidate));
        if (idx >= 0) return idx;
    }
    return -1;
}

function mapTrajectoryFromValues(values, idx) {
    const id = parseInt(String(values[idx.id] || '').trim(), 10) || 0;
    if (id <= 0) return null;

    return {
        id,
        position: String(values[idx.position] || '').trim(),
        lastAttestationDate: String(values[idx.lastAttestationDate] || '').trim(),
        nextAttestationDate: String(values[idx.nextAttestationDate] || '').trim(),
        lastCpkDate: String(values[idx.lastCpkDate] || '').trim(),
        cpkSubject: String(values[idx.cpkSubject] || '').trim(),
        nextCpkDate: String(values[idx.nextCpkDate] || '').trim(),
        internshipDate: String(values[idx.internshipDate] || '').trim(),
        professionRank: String(values[idx.professionRank] || '').trim(),
        internshipSubject: String(values[idx.internshipSubject] || '').trim(),
        portfolioLink: String(values[idx.portfolioLink] || '').trim(),
        report2526Link: String(values[idx.report2526Link] || '').trim(),
        report2425Link: String(values[idx.report2425Link] || '').trim()
    };
}

function buildTrajectoryIndex(headers) {
    return {
        id: findHeaderIndex(headers, ['ID']),
        position: findHeaderIndex(headers, ['Посада']),
        lastAttestationDate: findHeaderIndex(headers, ['Дата останньої атестації']),
        nextAttestationDate: findHeaderIndex(headers, ['Дата наступної атестації']),
        lastCpkDate: findHeaderIndex(headers, ['Дата проходження останніх КПК']),
        cpkSubject: findHeaderIndex(headers, ["Суб'єкт КПК"]),
        nextCpkDate: findHeaderIndex(headers, ['Дата наступного проходження КПК']),
        internshipDate: findHeaderIndex(headers, ['Дата проходження стажування']),
        professionRank: findHeaderIndex(headers, ['Професія/розряд']),
        internshipSubject: findHeaderIndex(headers, ["Суб'єкт стажування"]),
        portfolioLink: findHeaderIndex(headers, ['Покликання на електронне портфоліо педагога']),
        report2526Link: findHeaderIndex(headers, ['Покликання на звіт педагога 2025/2026н.р.']),
        report2425Link: findHeaderIndex(headers, ['Покликання на звіт педагога 2024/2025н.р.'])
    };
}

function parseTrajectoryCSV(text) {
    const rows = parseCSVData(text);
    if (rows.length < 2) return [];

    const headers = rows[0];
    const idx = buildTrajectoryIndex(headers);
    if (idx.id < 0) return [];

    const result = [];
    for (let i = 1; i < rows.length; i++) {
        const record = mapTrajectoryFromValues(rows[i], idx);
        if (record) result.push(record);
    }
    return result;
}

function parseGvizTrajectory(textOrPayload) {
    const payload = typeof textOrPayload === 'string'
        ? (() => {
            const match = textOrPayload.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?/);
            if (!match || !match[1]) return null;
            return JSON.parse(match[1]);
        })()
        : textOrPayload;
    if (!payload) return [];
    const table = payload?.table;
    const cols = table?.cols || [];
    const rows = table?.rows || [];
    const headers = cols.map(c => (c?.label || '').trim());
    const idx = buildTrajectoryIndex(headers);
    if (idx.id < 0) return [];

    const result = [];
    for (const row of rows) {
        const cells = row?.c || [];
        const values = cells.map(cell => String(cell?.f ?? cell?.v ?? '').trim());
        const record = mapTrajectoryFromValues(values, idx);
        if (record) result.push(record);
    }
    return result;
}

function buildCertIndex(headers) {
    return {
        id: findHeaderIndex(headers, ['ID']),
        name: findHeaderIndex(headers, ['П.І.П']),
        cpkSubject: findHeaderIndex(headers, ["Суб'єкт КПК"]),
        cpkStatus: findHeaderIndex(headers, ["Статус суб'єкта КПК ліцензований/неліцензований", "Статус суб'єкта КПК"]),
        form: findHeaderIndex(headers, ['Форма навчання']),

        ects: findHeaderIndex(headers, ['кредити ЕКТС', 'кредити ЕКТС,'])
    };
}

function mapCertFromValues(values, idx, year) {
    const id = parseInt(String(values[idx.id] || '').trim(), 10) || 0;
    if (id <= 0) return null;

    return {
        id,
        year,
        name: String(values[idx.name] || '').trim(),
        cpkSubject: String(values[idx.cpkSubject] || '').trim(),
        cpkStatus: String(values[idx.cpkStatus] || '').trim(),

        hours: String(values[idx.hours] || '').trim(),
        ects: String(values[idx.ects] || '').trim()
    };
}

function parseCertProgramsCSV(text, year) {
    const rows = parseCSVData(text);
    if (rows.length < 2) return [];
    const headers = rows[0];
    const idx = buildCertIndex(headers);
    if (idx.id < 0) return [];

    const result = [];
    for (let i = 1; i < rows.length; i++) {
        const rec = mapCertFromValues(rows[i], idx, year);
        if (rec) result.push(rec);
    }
    return result;
}

function parseGvizCertPrograms(textOrPayload, year) {

            if (!match || !match[1]) return null;

    }
    return result;
}

function parseCSVData(text) {
    const rows = [];
    let current_row = [];
    let current_field = '';
    let in_quotes = false;
    let i = 0;
    
    while (i < text.length) {
        const char = text[i];
        
        if (char === '"') {
            if (in_quotes && text[i + 1] === '"') {
                current_field += '"';
                i += 2;
            } else {
                in_quotes = !in_quotes;
                i++;
            }
        } else if (char === ',' && !in_quotes) {
            current_row.push(current_field.trim());
            current_field = '';
            i++;
        } else if ((char === '\n' || char === '\r') && !in_quotes) {
            if (current_field || current_row.length > 0) {
                current_row.push(current_field.trim());
                if (current_row.some(v => v)) {
                    rows.push(current_row);
                }
                current_row = [];
                current_field = '';
            }
            if (char === '\r' && text[i + 1] === '\n') i++;
            i++;
        } else {
            current_field += char;
            i++;
        }
    }
    
    if (current_field || current_row.length > 0) {
        current_row.push(current_field.trim());
        if (current_row.some(v => v)) {
            rows.push(current_row);
        }
    }
    
    return rows;
}

function escapeHtml(text) {
    const div = document.createElement('div');

async function checkFileChanges() {
    const files = ['./Педагоги.csv'];
    let changed = false;
    
    for (const file of files) {
        try {
            const response = await fetchWithTimeout(file, 2000);
            if (response.ok) {
                const lastModified = response.headers.get('last-modified');
                if (lastModified && fileModifyTimes[file] && fileModifyTimes[file] !== lastModified) {
                    console.log(`📝 Файл змінився: ${file}`);
                    changed = true;
                }
                fileModifyTimes[file] = lastModified;
            }
        } catch (e) {
            console.warn(`⚠️  Не можна перевірити ${file}:`, e.message);
        }
    }
    
    if (changed) {
        console.log('🔄 Перезавантажую дані...');
        await loadData();
        const { page, id } = parseRoute();
        
        if (page === 'trajectory' && id) {
            renderTrajectory(document.getElementById('app'), id);
        } else if (page === 'cert-programs' && id) {
            renderCertPrograms(document.getElementById('app'), id);
        } else {
            renderApp();
        }
    }
}

function startFileMonitoring() {
    if (!IS_LOCALHOST) return;
    if (isMonitoring) return;
    isMonitoring = true;
    console.log('👁️  Запущено моніторинг файлів...');
    fileMonitoringInterval = setInterval(checkFileChanges, 5000);
}

function stopFileMonitoring() {
    if (fileMonitoringInterval) {
        clearInterval(fileMonitoringInterval);
        fileMonitoringInterval = null;
        isMonitoring = false;
        console.log('⛔ Моніторинг файлів зупинено');
    }
}

function parseRoute() {
    const hash = window.location.hash.slice(1) || 'directory';
    const cleanHash = hash.split('?')[0];

    const certMatch = cleanHash.match(/^cert-programs-(\d+)$/);
    if (certMatch) return { page: 'cert-programs', id: parseInt(certMatch[1], 10) };

    const trajectoryMatch = cleanHash.match(/^trajectory-(\d+)$/);
    if (trajectoryMatch) return { page: 'trajectory', id: parseInt(trajectoryMatch[1], 10) };

    const profileMatch = cleanHash.match(/^profile-(\d+)$/);
    if (profileMatch) return { page: 'profile', id: parseInt(profileMatch[1], 10) };

    if (cleanHash === 'statistics') return { page: 'statistics', id: null };

    return { page: 'directory', id: null };
}

function parseHoursValue(hoursText) {
    const normalized = String(hoursText || '').replace(',', '.').match(/\d+(\.\d+)?/);
    return normalized ? parseFloat(normalized[0]) : 0;
}

function parseYearsValue(value) {
    const num = parseFloat(String(value || '').replace(',', '.'));
    return Number.isFinite(num) ? num : 0;
}

function toPercent(count, total) {
    if (!total) return '0%';
    return `${((count / total) * 100).toFixed(1)}%`;
}

function extractTariff(value) {
    const text = String(value || '');
    const match = text.match(/(\d+)\s*т\.?\s*р/i) || text.match(/(\d+)\s*розряд/i) || text.match(/\b(\d{1,2})\b/);
    return match ? `${match[1]} т.р.` : null;
}

function extractCategoryCode(value) {
    const text = String(value || '').trim();
    if (!text) return null;
    const normalized = text.replace(/\s+/g, '').toUpperCase();
    if (normalized === 'В') return 'В';
    if (normalized === 'І') return 'І';
    if (normalized === 'ІІ') return 'ІІ';
    if (normalized === 'С') return 'С';
    return null;
}

function bucketPedExperience(years) {
    const y = parseYearsValue(years);
    if (y <= 3) return '1-3 роки';
    if (y <= 10) return '3-10 років';
    if (y <= 20) return '10-20 років';
    return 'Понад 20 років';
}

function countBy(items, getter) {
    const map = new Map();
    for (const item of items) {
        const key = getter(item) || 'Не вказано';
        map.set(key, (map.get(key) || 0) + 1);
    }
    return [...map.entries()].sort((a, b) => b[1] - a[1]);
}

        return v || null;
    }).filter(([label]) => label && label !== 'Не вказано');
    const pedExperienceBucketsRaw = countBy(allTeachers, t => bucketPedExperience(t.pedagogicalExperience));
    const pedExperienceOrder = ['1-3 роки', '3-10 років', '10-20 років', 'Понад 20 років'];
    const pedExperienceBuckets = pedExperienceOrder
        .map(label => [label, pedExperienceBucketsRaw.find(([key]) => key === label)?.[1] || 0])
        .filter(([, count]) => count > 0);

    app.innerHTML = `
        <div class="max-w-7xl mx-auto p-6 pb-24">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <h1 class="text-3xl font-bold">📊 Статистика педагогічної діяльності</h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-white rounded-lg border border-gray-200 p-5">
                    <div class="text-sm text-gray-600">Загальна кількість педагогів</div>
                    <div class="text-3xl font-bold text-blue-700 mt-2">${totalTeachers}</div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 p-5">
                    <div class="text-sm text-gray-600">Педагоги за суміщеною посадою</div>
                    <div class="text-3xl font-bold text-indigo-700 mt-2">${combinedPositionCount}</div>
                    <div class="text-sm text-gray-500 mt-1">${toPercent(combinedPositionCount, totalTeachers)} від загальної кількості</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                ${renderDistributionChart('Категорії за основною посадою', mainCategories, totalTeachers)}
                ${renderDonutLegendChart('Категорії за суміщеною посадою', combinedCategories, Math.max(combinedPositionCount, 1))}
                ${renderCompactTableChart('Тарифні розряди за основною посадою', mainTariffs, totalTeachers)}
                ${renderDonutLegendChart('Педагогічні звання', pedagogicalTitles, totalTeachers)}
                ${renderDistributionChart('Стаж педагогічний', pedExperienceBuckets, totalTeachers)}
            </div>
        </div>
        ${renderBottomNav('statistics')}
    `;
}

function renderCertPrograms(app, id) {
    const teacher = allTeachers.find(t => t.id === id);
    if (!teacher) return;

    const yearMatch = window.location.hash.match(/year=(2025|2026)/);
    const selectedYear = yearMatch ? parseInt(yearMatch[1], 10) : 2026;
    const rows = allCertPrograms[selectedYear].filter(c => c.id === id);
    const totalHours = rows.reduce((sum, row) => sum + parseHoursValue(row.hours), 0);

    app.innerHTML = `
        <div class="max-w-7xl mx-auto p-6 pb-24">
            <button onclick="location.hash='profile-${id}'" class="mb-6 text-blue-600 hover:text-blue-800 font-medium">
                ← До профіля
            </button>

            <h1 class="text-3xl font-bold mb-6">📚 ${escapeHtml(teacher.name)}: Сертифікаційні програми</h1>

            <div class="mb-4 flex gap-2">
                <button
                    onclick="location.hash='cert-programs-${id}?year=2026'"
                    class="px-4 py-2 rounded font-medium ${selectedYear === 2026 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}"
                >
                    2026 рік
                </button>
                <button
                    onclick="location.hash='cert-programs-${id}?year=2025'"
                    class="px-4 py-2 rounded font-medium ${selectedYear === 2025 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}"
                >
                    2025 рік
                </button>
            </div>

            <div class="bg-white rounded-lg border border-gray-200 p-4 overflow-x-auto">
                ${rows.length === 0 ? '<p class="text-gray-500 py-8 text-center">Немає сертифікацій за обраний рік</p>' : `
                    <table class="w-full text-sm border-collapse min-w-[1150px]">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="border border-gray-300 px-3 py-2 text-left">П.І.П</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Суб'єкт КПК</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Статус суб'єкта КПК</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Форма навчання</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Тема навчання</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Сертифікат (серія, номер)</th>
                                <th class="border border-gray-300 px-3 py-2 text-left">Дата видачі</th>
                                <th class="border border-gray-300 px-3 py-2 text-center">Кількість годин</th>
                                <th class="border border-gray-300 px-3 py-2 text-center">Кредити ЕКТС</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map((row, i) => `
                                <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50">
                                    ${i === 0 ? `<td rowspan="${rows.length}" class="border border-gray-300 px-3 py-2 align-top font-medium">${escapeHtml(teacher.name || '—')}</td>` : ''}
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.cpkSubject || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.cpkStatus || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.form || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.topic || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.certificate || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2">${escapeHtml(row.issueDate || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2 text-center">${escapeHtml(row.hours || '—')}</td>
                                    <td class="border border-gray-300 px-3 py-2 text-center">${escapeHtml(row.ects || '—')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `}
            </div>

            <div class="mt-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="text-sm text-blue-700 font-medium">Сума годин за рік (${selectedYear}):</div>
                <div class="text-2xl font-bold text-blue-900">${totalHours % 1 === 0 ? totalHours.toFixed(0) : totalHours.toFixed(1)}</div>
            </div>
        </div>
        ${renderBottomNav('cert-programs')}
    `;
}

function renderBottomNav(activePage) {
    const isCardsActive = activePage === 'directory';
    const isStatsActive = activePage === 'statistics';
    return `
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-20">
            <div class="max-w-7xl mx-auto px-4 py-3">
                <div class="flex items-center justify-center gap-3">
                    <button
                        onclick="location.hash='directory'"
                        class="px-6 py-2 rounded-lg font-medium transition ${
                            isCardsActive
                                ? 'bg-blue-600 text-white'
                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }"
                    >
                        🗂️ Картки
                    </button>
                    <a
                        href="https://datastudio.google.com/reporting/c0c5592b-4023-4707-a20d-15530ca67ad3"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="px-6 py-2 rounded-lg font-medium transition bg-gray-100 text-gray-700 hover:bg-gray-200"
                    >
                        📈 Показники педагогічної діяльності
                    </a>
                    <button
                        onclick="location.hash='statistics'"
                        class="px-6 py-2 rounded-lg font-medium transition ${
                            isStatsActive
                                ? 'bg-blue-600 text-white'
                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }"
                    >
                        📊 Статистика
                    </button>
                </div>
            </div>
        </nav>
    `;
}

// ============= СТАРТ =============
async function main() {
    const app = document.getElementById('app');
    app.innerHTML = '<div class="flex items-center justify-center h-screen"><div class="text-center"><div class="shimmer w-16 h-16 rounded-full mb-4 mx-auto"></div><p>Завантаження даних...</p></div></div>';
    
    const loaded = await loadData();
    
    if (loaded) {
        renderApp();
        window.addEventListener('hashchange', renderApp);
        startFileMonitoring();
    } else {
        const details = escapeHtml(window.__lastLoadError?.message || '');
        app.innerHTML = `
            <div class="max-w-3xl mx-auto p-8">
                <div class="bg-white rounded-lg border border-red-200 p-6">
                    <div class="text-red-700 font-semibold text-lg">Помилка завантаження даних</div>
                    <div class="text-gray-700 mt-2">Перевірте доступ до Google Sheets (публічний перегляд за посиланням) або мережу.</div>
                    ${details ? `<div class="mt-3 text-xs text-gray-500 break-words">${details}</div>` : ''}
                    <div class="mt-5 flex flex-wrap gap-2 justify-center">
                        <button onclick="location.reload()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">
                            🔄 Спробувати ще раз
                        </button>
                        <button onclick="location.hash='directory'; location.reload()" class="px-5 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium">
                            🗂️ На головну
                        </button>
                    </div>
                </div>
            </div>
        `;
    }
}

main();
</script>
